name: Docs Check

# 設計書などの Markdown がフォーマットどおりに作られているかをチェックする
on:
  push:
    branches:
      - main
      - "docs/**"
      - "chore/**"
      - "feature/**"
    paths:
      - "**/*.md"
      - "docs/**"
      - "scripts/check-docs.mjs"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/docs-check.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "docs/**"
      - "scripts/check-docs.mjs"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/docs-check.yml"
  workflow_dispatch:

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Markdown lint
        run: npx --yes markdownlint-cli2

      - name: Design doc format check
        run: node scripts/check-docs.mjs
